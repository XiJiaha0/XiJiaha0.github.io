# .github/workflows/update-index.yml
name: Auto Update Index

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.AUTO_UPDATE_TOKEN }}
        
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Debug file structure
      run: |
        echo "=== 当前目录结构 ==="
        ls -la
        echo "=== scripts目录内容 ==="
        ls -la scripts/ || echo "scripts目录不存在"
        echo "=== 根目录内容 ==="
        ls -la ./
        
    - name: Update index.html
      run: |
        # 确保在正确的路径执行
        pwd
        ls -la
        python scripts/update_index.py
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git diff --staged --quiet || (git commit -m "Auto-update: 同步仓库文件列表" && git push)
